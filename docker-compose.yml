version: '3.8'

services:
  mongodb:
    image: mongo:8.0
    container_name: quizarena_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: quizarena_enterprise
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: quizarena_server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/quizarena_enterprise
      JWT_SECRET: quizarena_prod_secret_token_key_2026
      CLIENT_URL: http://localhost:5173
      ADMIN_EMAIL: admin@quizarena.com
      ADMIN_PASSWORD: Admin@123456
    depends_on:
      - mongodb

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: quizarena_client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  mongo_data:
